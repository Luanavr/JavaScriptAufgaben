<html>
<head>
   <meta charset="UTF-8">
   <title>Formular validieren</title>
   <script>
     function validieren(e) {
       let form = document.forms["fragebogen"];
      
         console.log("hier");
         console.log(form.elements["html"])
         console.log(form.elements["html"].checked);

        
         //verhindern, dass Formular abgeschickt wird.
         e.preventDefault(); 
         if (form.elements["fullname"].value == "")  {
            alert("Name fehlt.")
            form.elements["fullname"].focus();
            return;
         } 
         if (form.elements["gender"].value == "") {
            alert("Geschlecht fehlt.");
            return; 
         } 
         if (form.elements["html"].checked != "true" && form.elements["css"].checked != "true" && form.elements["js"].checked != "true") {

            alert("Teile uns bitte mit, wofür du dich interessierst.");
            return;
         }
         //Formular abschicken.
         form.submit();
      }
   </script>
</head>
<body>
   <h1>Formular</h1>
   <form name="fragebogen" action="https://blj-ict-bz.ch/formlog/" method= "post">
      <div>
         Dein Name: <input type="text" name="fullname" />
      </div>
      <div>
         Geschlecht: 
         <input type="radio" name="gender" value="m" /> männlich 
         <input type="radio" name="gender" value="w" /> weiblich
      </div>
      <div>
         Wofür interessierst du dich? 
         <input type="checkbox" name="html" value="html" /> HTML 
         <input type="checkbox" name="css" /> CSS 
         <input type="checkbox" name="js" /> JavaScript
      </div>
      <div>
         <input type="submit" value="Absenden" />
      </div>
   </form>
   <script>
      document.forms["fragebogen"].addEventListener("submit", validieren);
   </script>
</body>
</html>
