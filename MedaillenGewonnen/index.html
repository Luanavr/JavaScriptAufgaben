<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Medaillenspiegel</h1>
    <canvas id="cvs" height="480" width="640"></canvas>
    <div id="medals"></div>

    <script>

        window.onload = function () {
            const cvs = document.getElementById("cvs");
            const ctx = cvs.getContext("2d");

            ctx.scale(1, -1);
            ctx.translate(0, -100);

            //3x Gold
            zeichneBalken(ctx, 0, 3, "gold");

            //2x Silber
            zeichneBalken(ctx, 30, 2, "silver")

            //5x Bronze   
            zeichneBalken(ctx, 60, 5, "#CD7F32")

        }


        function zeichneBalken(context, x, amount, colorOfMedal) {
            context.fillStyle = colorOfMedal;
            context.fillRect(x, 0, 30, amount * 20);
            context.strokeRect(x, 0, 30, amount * 20);

            context.save();          
            context.scale(1, -1);       
            context.fillStyle = "black"; 
            context.font = "16px Arial";
            context.textAlign = "center";
            context.fillText(amount, x + 15, 20); 
            context.restore();           



        }
    </script>

</body>

</html>
